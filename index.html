<div class="wrap">

<dialog id="resetDialog"><h3>A fresh start?</h3><p>This clears your answers, progress, wishes and photo on this browser. Save your keepsake first if you want to keep it.</p><div class="actions"><button class="btn light" id="cancelReset">Keep my answers</button><button class="btn" id="confirmReset">Clear my activity</button></div></dialog>
<script>
'use strict';
const KEY='pfano-high-tea-v1';
const quiz=[

{q:"Which university is Pfano an alumna of?",options:["Wits","UCT","UJ"],correct:2,bonus:"If Pfano got into a parking lot shouting match back in her campus days, what would her ultimate signature insult be?"},
{q:"What is Pfano's zodiac sign?",options:["Scorpio","Pisces","Taurus"],correct:1,bonus:'What is the most "typical Pisces" thing Pfano has done recently? (If you don’t know astrology, make up a dramatic personality trait!)'},
{q:"How many kids does Pfano have?",options:["One","Two","Three"],correct:1,bonus:'When her kids are being completely chaotic, what is Pfano’s ultimate "mom code word" or look that signals she needs a glass of champagne immediately?'},
{q:"What is Pfano's biggest fear?",options:["The dark","Dogs","Water"],correct:1,bonus:"If a tiny, fluffy Pomeranian puppy accidentally walked into this high tea right now, describe Pfano's exact escape route or dramatic reaction."}
];
const dilemmas=[
["Be a dedicated church girlie in the front row","Sleep in late and skip the sermon"],
["Spend the day shopping at a luxury mall","Relax all afternoon at a quiet day spa"],
["Go out for a fast-paced power walk","Sit on the couch streaming a hit series"],
["Wake up early to catch the sunrise","Stay up late to watch the stars"],
["An absolute marathon long round","A quick, fast-paced encounter"],
["Go to a high-energy music festival","Go to an intimate, quiet dinner party"],
["Wind down with a little bit of green","Sip on a glass of luxury champagne"],

["Be completely overdressed for an event","Be slightly underdressed but comfortable"],
["Travel to a bustling, cosmopolitan city","Retreat to a quiet beach holiday"],
["Have a masterfully organized daily schedule","Wing it and see where the day takes her"],
["Watch a thrilling crime documentary","Watch a lighthearted romantic comedy"],

const titles=["The Race Against Time","Pfano's Dilemma","Guess Who","Wishes for Pfano"];
const fresh=()=>({version:1,timerSeconds:6,name:"",view:"home",trivia:quiz.map(()=>({choice:null,locked:false,bonus:"",deadline:null})),tIndex:0,tDone:false,dAnswers:Array(15).fill(null),dIndex:0,dDone:false,bAnswers:Array(10).fill(null),bIndex:0,bDone:false,wishes:"",photo:"",cardViewed:false});
let state=fresh(),storageOK=true,tickId=null,toastId=null,photoBusy=false;
const $=id=>document.getElementById(id);
const esc=value=>String(value??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
function warn(text){$('storageWarning').hidden=false;$('storageWarning').textContent=text}
function valid(s){return s&&s.version===1&&typeof s.name==='string'&&typeof s.wishes==='string'&&typeof s.photo==='string'&&(!s.photo||s.photo.startsWith('data:image/jpeg;base64,'))&&['home','tIntro','trivia','tReview','dIntro','dilemma','dReview','bIntro','bride','bReview','wishes','card'].includes(s.view)&&Number.isInteger(s.tIndex)&&s.tIndex>=0&&s.tIndex<5&&Number.isInteger(s.dIndex)&&s.dIndex>=0&&s.dIndex<15&&Number.isInteger(s.bIndex)&&s.bIndex>=0&&s.bIndex<10&&Array.isArray(s.trivia)&&s.trivia.length===5&&s.trivia.every(r=>r&&[null,0,1,2].includes(r.choice)&&typeof r.bonus==='string'&&typeof r.locked==='boolean'&&(r.deadline===null||Number.isFinite(r.deadline)))&&Array.isArray(s.dAnswers)&&s.dAnswers.length===15&&s.dAnswers.every(x=>[null,0,1].includes(x))&&Array.isArray(s.bAnswers)&&s.bAnswers.length===10&&s.bAnswers.every(x=>[null,0,1].includes(x))}
try{const raw=localStorage.getItem(KEY);if(raw){const saved=JSON.parse(raw);if(valid(saved)){state={...fresh(),...saved};if(saved.timerSeconds!==6){state.trivia.forEach(r=>{if(!r.locked&&r.deadline!==null)r.deadline-=4000});state.timerSeconds=6}}else{storageOK=false;warn("Your saved activity could not be opened. It has been left untouched. Download a backup before choosing a fresh start.")}}else{localStorage.setItem(KEY,JSON.stringify(state))}}catch(e){storageOK=false;warn("This browser could not open saved activity. Keep this tab open and download a backup. A regular browser window at a website link is best for saving.")}

function home(){const counts=[state.trivia.filter(r=>r.locked).length,state.dAnswers.filter(x=>x!==null).length,state.bAnswers.filter(x=>x!==null).length];return '<section class="hero"><div class="hero-copy"><div class="eyebrow">A little play. A lot of love.</div><h1>Tea, laughter<br>&amp; all things Pfano.</h1><p>Three games, your favourite people, and a beautiful new chapter to celebrate.</p><div class="ribbon"><span class="pill pink">10 October 2026</span><span class="pill blue">The Palazzo · Montecasino</span></div></div><figure class="hero-scene"><img src="'+HERO_IMAGE+'" alt="Ivory and gold high-tea china, tiered patisserie and blush and lilac flowers" fetchpriority="high"></figure></section><section class="panel welcome"><div><label class="field" for="guestName">First, what shall we call you?</label><input id="guestName" type="text" maxlength="80" autocomplete="given-name" placeholder="Your name" value="'+esc(state.name)+'"><p class="muted" style="margin:12px 0 0">Your answers, ready to read aloud together.</p></div></section><div class="section-heading"><span class="eyebrow">The afternoon’s amusements</span><span>01 — 04</span></div><div class="games">'+titles.map((title,i)=>'<button class="game '+['pink','purple','blue','cream'][i]+'" data-action="open" data-game="'+i+'"><img class="game-photo photo-'+i+'" src="'+GAME_IMAGES[i]+'" alt="'+GAME_IMAGE_ALTS[i]+'" loading="lazy"><div class="game-copy"><span class="n">0'+(i+1)+'</span><h3>'+esc(title)+'</h3><p class="muted">'+['How well do you know our guest of honour?','Fifteen little choices. What would she pick?','Two people, ten questions. Who gets your vote?','A note, a photo, a memory to keep.'][i]+'</p><small>'+([state.tDone,state.dDone,state.bDone,state.cardViewed][i]?'View your '+(i===3?'card':'answers')+' ↗':i===3?(state.wishes||state.photo?'Continue your card ↗':'Make your card ↗'):(counts[i]?counts[i]+' answers saved · Continue ↗':'Let’s play ↗'))+'</small></div></button>').join('')+'</div><div class="row"><button class="link" data-action="backup">Download activity backup</button><label class="link" for="restoreFile" style="cursor:pointer">Restore a backup</label><input id="restoreFile" type="file" accept=".json,application/json" hidden><button class="link" data-action="reset">Start fresh</button></div><p class="muted">Use the same browser to return to your activity. Clearing browser data removes your saved answers.</p>'}
function intro(kind){const i={t:0,d:1,b:2}[kind];return '<section class="panel"><div class="eyebrow">Game 0'+(i+1)+'</div><h2>'+esc(titles[i])+'</h2><p>'+["Five quick questions, five wonderfully speculative bonuses. You have 6 seconds for each multiple-choice question. Your selected answer locks when time runs out, then the full correct answer and bonus prompt appear. Take your time with the bonus; the next timer starts only when you tap Next question.","Would she rather? Pick one of two choices for each of the 15 scenarios. Confirmed choices lock in. At the end, read your answers alongside Pfano’s and count your matches together.","Choose Pfano or Hubby for each of the 10 questions. Confirmed choices lock in. Your complete answer sheet will be ready when Pfano reveals hers."][i]+'</p><p class="muted">'+(i===0?'Keep this tab open during timed questions. Switching away does not pause the timer.':'')+'</p><div class="actions"><button class="btn" data-action="begin" data-kind="'+kind+'">'+(i===0?'Start my first 6 seconds':'Let’s begin')+'</button></div></section>'}
function trivia(){const i=state.tIndex,r=state.trivia[i],q=quiz[i];if(!r.locked&&r.deadline===null){r.deadline=Date.now()+6000;save()}if(!r.locked&&Date.now()>=r.deadline){r.locked=true;save()}return '<section class="panel"><div class="row"><span class="eyebrow" style="margin:0">The Race Against Time</span>'+(!r.locked?'<span id="timer" class="timer" role="timer">6s</span>':'<span class="badge">Answer locked</span>')+'</div>'+progress(i+1,5)+'<p class="question-number">Question '+(i+1)+' of 5</p><h2>'+esc(q.q)+'</h2>'+(!r.locked?opt(q.options,r.choice)+'<p class="muted">Choose your answer. It locks automatically when the 6 seconds are up.</p>':'<p class="muted">Your answer: <strong>'+esc(r.choice===null?'No answer selected':q.options[r.choice])+'</strong></p><div class="answer"><span class="label">The correct answer</span><strong>'+esc(q.options[q.correct])+'</strong></div><div class="eyebrow" style="margin-top:28px">A little imagination…</div><label for="bonus" class="field" style="font-size:17px;font-weight:500">'+esc(q.bonus)+'</label><textarea id="bonus" maxlength="5000" placeholder="Give us your best theory…">'+esc(r.bonus)+'</textarea><p class="muted">No timer for this one. Your words save as you type.</p><div class="actions"><button class="btn" data-action="nextTrivia">'+(i===4?'See all my answers':'Next question · 6 seconds')+'</button></div>')+'</section>'}
function choiceGame(kind){const d=kind==='d',i=d?state.dIndex:state.bIndex,arr=d?state.dAnswers:state.bAnswers,options=d?dilemmas[i]:['Pfano','Hubby'];return '<section class="panel"><div class="eyebrow">'+esc(titles[d?1:2])+'</div>'+progress(i+1,arr.length)+'<p class="question-number">Question '+(i+1)+' of '+arr.length+'</p><h2>'+esc(d?'Would she rather…':bride[i])+'</h2>'+opt(options,arr[i])+'<p class="muted">Tap a choice, then confirm to lock it in.</p><div class="actions"><button id="confirmChoice" class="btn" data-action="nextChoice" data-kind="'+kind+'" '+(arr[i]===null?'disabled':'')+'>'+(i===arr.length-1?'Confirm & see my answers':'Confirm & next')+'</button></div></section>'}
function review(kind){const t=kind==='t',d=kind==='d',i=t?0:d?1:2;let rows='';if(t)rows=quiz.map((q,n)=>{const r=state.trivia[n];return '<article class="review"><span class="question-number">Question '+(n+1)+'</span><h3>'+esc(q.q)+'</h3><div class="label">Your answer</div><div>'+esc(r.choice===null?'No answer selected':q.options[r.choice])+'</div><div class="label">Correct answer</div><div>'+esc(q.options[q.correct])+'</div><div class="label">Bonus prompt</div><p>'+esc(q.bonus)+'</p><div class="text">'+esc(r.bonus||'No bonus response added.')+'</div></article>'}).join('');else rows=(d?dilemmas:bride).map((q,n)=>'<article class="review"><span class="question-number">Question '+(n+1)+'</span><h3>'+esc(d?'Would she rather…':q)+'</h3>'+(d?'<p class="muted">A: '+esc(q[0])+'<br>B: '+esc(q[1])+'</p>':'')+'<div class="label">Your answer</div><div>'+esc(d?dilemmas[n][state.dAnswers[n]]:['Pfano','Hubby'][state.bAnswers[n]])+'</div></article>').join('');return '<section class="panel"><div class="eyebrow">Your answer sheet'+(state.name?' · '+esc(state.name):'')+'</div><h2>'+esc(titles[i])+'</h2><p class="muted">'+(t?'Your answers and bonus thoughts, all together for the big reveal.':'Keep this page open while Pfano reads hers aloud. Compare your answers and count your matches together.')+'</p>'+rows+'<div class="actions"><button class="btn" data-action="home">Back to the games</button><button class="btn light" data-action="exportAnswers" data-kind="'+kind+'">Save my answer sheet</button></div></section>'}
function wishes(){return '<section class="panel wishes-panel"><div class="eyebrow">A keepsake for the guest of honour</div><h2>Wishes for Pfano</h2><p>A little love for her next massive chapter as a partner, Makoti, and mother.</p><label class="field" for="cardName">With love from</label><input id="cardName" type="text" maxlength="80" value="'+esc(state.name)+'" placeholder="Your name"><label class="field" for="wishes" style="margin-top:24px">Your heartfelt wishes, blessing, or funny advice</label><textarea id="wishes" maxlength="6000" placeholder="Dear Pfano…">'+esc(state.wishes)+'</textarea><label class="field" for="photo" style="margin-top:24px">Your high tea photo with Pfano</label><div class="upload"><input id="photo" type="file" accept="image/*"><p class="muted" style="margin:10px 0 0">Choose a photo from your phone, or use your camera if offered.</p></div>'+(state.photo?'<img class="preview-photo" src="'+state.photo+'" alt="Your selected photo with Pfano"><br><button class="link" data-action="removePhoto">Remove photo</button>':'')+'<p id="photoStatus" class="muted"></p><div class="actions"><button id="previewCard" class="btn" data-action="preview">Preview my card</button></div></section>'}

function cardMarkup(){return '<article class="card"><div class="eyebrow">A keepsake from Pfano’s High Tea</div><div class="card-rule"></div><h2>For your beautiful<br>next chapter.</h2>'+(state.photo?'<img class="photo" src="'+state.photo+'" alt="A high tea memory with Pfano">':'')+'<p class="wish">'+esc(state.wishes)+'</p><div class="card-rule"></div><p class="sign">With love, '+esc(state.name||'your high tea friend')+'</p><div class="eyebrow" style="margin-top:30px">10 October 2026 · The Palazzo, Montecasino</div></article>'}
function card(){return '<section style="margin:36px auto;max-width:780px"><div class="eyebrow">Your keepsake</div><div id="cardPages" aria-busy="true">'+cardMarkup()+'</div><p id="cardStatus" class="muted" role="status">Preparing your keepsake…</p><div class="actions"><button class="btn" data-action="downloadPDF">Download PDF</button><button class="btn light" data-action="shareCard">Share card</button></div><div class="actions"><button class="btn light" data-action="downloadCard">Save card image</button><button class="btn light" data-action="editCard">Edit my card</button></div><p class="muted" style="margin-top:16px">Your preview matches the saved card. The layout adjusts to fit your message before adding another page. Save the PDF or image to send to Pfano.</p></section>'}
let cardCache=null,cardTask=null,cardTaskKey='';
const cardKey=()=>JSON.stringify([state.name,state.wishes,state.photo]);
async function getCardPages(){const key=cardKey();if(cardCache&&cardCache.key===key)return cardCache.pages;if(cardTask&&cardTaskKey===key)return cardTask;const snapshot={name:state.name,wishes:state.wishes,photo:state.photo};cardTaskKey=key;cardTask=drawCardPages(snapshot).then(pages=>{if(cardKey()===key)cardCache={key,pages};return pages}).finally(()=>{if(cardTaskKey===key)cardTask=null});return cardTask}
async function showCardPreview(){const key=cardKey();try{const pages=await getCardPages();if(state.view!=='card'||key!==cardKey())return;$('cardPages').innerHTML=pages.map((c,i)=>'<img class="pdf-page" src="'+c.toDataURL('image/png')+'" alt="Keepsake page '+(i+1)+' of '+pages.length+'">').join('');$('cardPages').setAttribute('aria-busy','false');$('cardStatus').textContent=pages.length===1?'One beautifully composed A4 keepsake.':pages.length+' A4 pages · every word included.'}catch(e){if($('cardStatus'))$('cardStatus').textContent='The preview could not be prepared. '+e.message}}

function render(){clearInterval(tickId);const v=state.view;$('app').innerHTML=v==='home'?home():v==='tIntro'?intro('t'):v==='dIntro'?intro('d'):v==='bIntro'?intro('b'):v==='trivia'?trivia():v==='dilemma'?choiceGame('d'):v==='bride'?choiceGame('b'):v==='tReview'?review('t'):v==='dReview'?review('d'):v==='bReview'?review('b'):v==='wishes'?wishes():card();if(v==='trivia'&&!state.trivia[state.tIndex].locked){updateTimer();tickId=setInterval(updateTimer,100)}if(v==='card')showCardPreview()}
function updateTimer(){if(state.view!=='trivia')return;const r=state.trivia[state.tIndex];if(r.locked)return;const remaining=Math.max(0,Math.ceil((r.deadline-Date.now())/1000));if(remaining===0){r.locked=true;save();render();return}const timer=$('timer');if(timer){timer.textContent=remaining+'s';timer.classList.toggle('urgent',remaining<=3)}}
function openGame(i){go(i===0?state.tDone?'tReview':state.trivia.some(r=>r.deadline!==null)?'trivia':'tIntro':i===1?state.dDone?'dReview':state.dIndex>0||state.dAnswers[0]!==null?'dilemma':'dIntro':i===2?state.bDone?'bReview':state.bIndex>0||state.bAnswers[0]!==null?'bride':'bIntro':state.cardViewed?'card':'wishes')}
function download(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}

function wrapText(ctx,text,maxWidth){const lines=[];for(const paragraph of text.split('\n')){if(!paragraph.trim()){lines.push('');continue}let line='';for(const word of paragraph.split(/\s+/)){const candidate=line?line+' '+word:word;if(ctx.measureText(candidate).width<=maxWidth){line=candidate;continue}if(line){lines.push(line);line=''}if(ctx.measureText(word).width<=maxWidth){line=word;continue}for(const char of Array.from(word)){if(ctx.measureText(line+char).width>maxWidth&&line){lines.push(line);line=char}else line+=char}}if(line)lines.push(line)}return lines}
function loadImage(src){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('This photo could not be opened. Try a JPG or PNG.'));img.src=src})}
async function drawCardPages(s){
const W=1240,H=1754,P=88,BOTTOM=1540,pages=[],picture=s.photo?await loadImage(s.photo):null;
const measure=document.createElement('canvas').getContext('2d');
const message=s.wishes.replace(/\r\n?/g,'\n').trim();
function plan(font,leading,photoMax){measure.font=font+'px Georgia';const lines=wrapText(measure,message,W-2*P);measure.font='italic 30px Georgia';const names=wrapText(measure,s.name||'your high tea friend',W-2*P);const photoHeight=picture?Math.min(photoMax,(W-2*P)*picture.height/picture.width):0;const top=picture?310+photoHeight+34:320;const signatureHeight=74+names.length*36;return {font,leading,photoHeight,top,lines,names,signatureHeight}}
const choices=[plan(34,46,420),plan(32,43,340),plan(30,40,280)];
const layout=choices.find(p=>p.top+p.lines.length*p.leading+p.signatureHeight<=BOTTOM)||choices[1];
let ctx,y,index=0;
function rule(at,x1=P,x2=W-P){ctx.strokeStyle='#b9a186';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(x1,at);ctx.lineTo(x2,at);ctx.stroke()}
function startPage(first){const c=document.createElement('canvas');c.width=W;c.height=H;pages.push(c);ctx=c.getContext('2d');ctx.fillStyle='#fffdf8';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#c6b299';ctx.lineWidth=1;ctx.strokeRect(40,40,W-80,H-80);ctx.textBaseline='alphabetic';ctx.textAlign='center';ctx.fillStyle='#7b6b59';ctx.font='19px sans-serif';ctx.fillText('PFANO’S HIGH TEA',W/2,96);rule(126);ctx.fillStyle='#392f29';ctx.font=(first?'58':'44')+'px Georgia';ctx.fillText(first?'For your beautiful':'A little more love,',W/2,first?203:192);ctx.fillText(first?'next chapter.':'just for you.',W/2,first?266:246);
y=first?layout.top:300;
if(first&&picture){const scale=Math.min((W-2*P)/picture.width,layout.photoHeight/picture.height),pw=picture.width*scale,ph=picture.height*scale;ctx.drawImage(picture,(W-pw)/2,310,pw,ph)}
ctx.textAlign='left';ctx.textBaseline='top';ctx.font=layout.font+'px Georgia';ctx.fillStyle='#40362f'}
function signature(){y+=26;rule(y,P,P+75);y+=14;ctx.fillStyle='#6b5946';ctx.font='italic 28px Georgia';ctx.fillText('With love,',P,y);y+=34;ctx.font='italic 30px Georgia';for(const nameLine of layout.names){ctx.fillText(nameLine,P,y);y+=36}}
startPage(true);
while(index<layout.lines.length){const remaining=layout.lines.length-index,available=BOTTOM-y;
if(remaining*layout.leading+layout.signatureHeight<=available){for(;index<layout.lines.length;index++){ctx.fillText(layout.lines[index],P,y);y+=layout.leading}signature();break}
const capacity=Math.max(0,Math.floor(available/layout.leading));let count=Math.min(capacity,remaining);
if(count===remaining)count=Math.max(0,remaining-2);
if(count===0){startPage(false);continue}
for(let n=0;n<count;n++){ctx.fillText(layout.lines[index++],P,y);y+=layout.leading}
startPage(false)}
if(layout.lines.length===0)signature();
pages.forEach((page,i)=>{ctx=page.getContext('2d');ctx.textBaseline='alphabetic';rule(1590);ctx.fillStyle='#7b6b59';ctx.textAlign='center';ctx.font='17px sans-serif';ctx.fillText('10 OCTOBER 2026  ·  THE PALAZZO, MONTECASINO',W/2,1630);ctx.font='16px Georgia';ctx.fillText(pages.length>1?(i+1)+' / '+pages.length:'A memory to keep',W/2,1672)});
return pages}
function canvasBlob(canvas,type='image/png',quality){return new Promise((resolve,reject)=>canvas.toBlob(b=>b?resolve(b):reject(new Error('The card could not be created. Please try again.')),type,quality))}
async function makeCardBlob(){const pages=await getCardPages();if(pages.length===1)return canvasBlob(pages[0]);const canvas=document.createElement('canvas');canvas.width=pages[0].width;canvas.height=pages.length*pages[0].height;const ctx=canvas.getContext('2d');pages.forEach((p,i)=>ctx.drawImage(p,0,i*p.height));return canvasBlob(canvas)}
async function makePDF(){const pages=await getCardPages(),parts=[],offsets=[0];let length=0;const bytes=s=>Uint8Array.from(Array.from(s),c=>c.charCodeAt(0)&255);const append=b=>{parts.push(b);length+=b.length};const text=s=>append(bytes(s));function object(id,body){offsets[id]=length;text(id+' 0 obj\n'+body+'\nendobj\n')}text('%PDF-1.4\n%\xE2\xE3\xCF\xD3\n');object(1,'<< /Type /Catalog /Pages 2 0 R >>');object(2,'<< /Type /Pages /Count '+pages.length+' /Kids ['+pages.map((_,i)=>(3+i*3)+' 0 R').join(' ')+'] >>');
for(let i=0;i<pages.length;i++){const pageID=3+i*3,imageID=pageID+1,contentID=pageID+2,c=pages[i];const jpeg=new Uint8Array(await (await canvasBlob(c,'image/jpeg',.94)).arrayBuffer());object(pageID,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 595.28 841.89] /Resources << /XObject << /Im0 '+imageID+' 0 R >> >> /Contents '+contentID+' 0 R >>');offsets[imageID]=length;text(imageID+' 0 obj\n<< /Type /XObject /Subtype /Image /Width '+c.width+' /Height '+c.height+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+jpeg.length+' >>\nstream\n');append(jpeg);text('\nendstream\nendobj\n');const commands='q\n595.28 0 0 841.89 0 0 cm\n/Im0 Do\nQ';object(contentID,'<< /Length '+commands.length+' >>\nstream\n'+commands+'\nendstream')}
const xref=length;const count=3+pages.length*3;text('xref\n0 '+count+'\n0000000000 65535 f \n');for(let id=1;id<count;id++)text(String(offsets[id]).padStart(10,'0')+' 00000 n \n');text('trailer\n<< /Size '+count+' /Root 1 0 R >>\nstartxref\n'+xref+'\n%%EOF');return new Blob(parts,{type:'application/pdf'})}

async function photoInput(file){if(!file)return;if(file.size>30*1024*1024){toast('Please choose a photo smaller than 30 MB.');return}photoBusy=true;$('previewCard').disabled=true;$('photoStatus').textContent='Preparing your photo…';let url;try{url=URL.createObjectURL(file);const img=await loadImage(url),scale=Math.min(1,1200/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*scale);c.height=Math.round(img.height*scale);const ctx=c.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,c.width,c.height);ctx.drawImage(img,0,0,c.width,c.height);const photo=c.toDataURL('image/jpeg',.8);if(photo.length>2500000)throw new Error('Please choose a smaller photo.');state.photo=photo;save();if(state.view==='wishes')render();toast('Your photo is ready.')}catch(e){toast(e.message)}finally{if(url)URL.revokeObjectURL(url);photoBusy=false;if($('previewCard'))$('previewCard').disabled=false;if($('photoStatus'))$('photoStatus').textContent=''}}
function exportAnswers(kind){const d=kind==='d',t=kind==='t';let text=t?quiz.map((q,i)=>{const r=state.trivia[i];return (i+1)+'. '+q.q+'\nYour answer: '+(r.choice===null?'No answer selected':q.options[r.choice])+'\nCorrect answer: '+q.options[q.correct]+'\nBonus: '+q.bonus+'\nYour response: '+(r.bonus||'No response')}).join('\n\n'):(d?dilemmas:bride).map((q,i)=>(i+1)+'. '+(d?'Would she rather '+q[0]+' OR '+q[1]+'?':q)+'\nYour answer: '+(d?q[state.dAnswers[i]]:['Pfano','Hubby'][state.bAnswers[i]])).join('\n\n');download(new Blob(["Pfano's High Tea\n"+titles[t?0:d?1:2]+'\n'+(state.name||'Guest')+'\n\n'+text],{type:'text/plain;charset=utf-8'}),'pfano-game-'+(t?1:d?2:3)+'-answers.txt')}
document.addEventListener('input',e=>{const id=e.target.id;if(id==='guestName'||id==='cardName')state.name=e.target.value;else if(id==='bonus')state.trivia[state.tIndex].bonus=e.target.value;else if(id==='wishes')state.wishes=e.target.value;else return;save()});
document.addEventListener('change',async e=>{if(e.target.name==='answer'){const value=Number(e.target.value);if(state.view==='trivia'){const r=state.trivia[state.tIndex];if(r.locked||Date.now()>=r.deadline){updateTimer();return}r.choice=value}else if(state.view==='dilemma'){state.dAnswers[state.dIndex]=value;$('confirmChoice').disabled=false}else if(state.view==='bride'){state.bAnswers[state.bIndex]=value;$('confirmChoice').disabled=false}save()}else if(e.target.id==='photo')await photoInput(e.target.files[0]);else if(e.target.id==='restoreFile'){const f=e.target.files[0];if(!f)return;try{if(f.size>5000000)throw new Error('This backup is too large.');const s=JSON.parse(await f.text());if(!valid(s))throw new Error('This is not a compatible activity backup.');if(!confirm('Replace activity on this browser with this backup?'))return;state={...fresh(),...s};if(s.timerSeconds!==6){state.trivia.forEach(r=>{if(!r.locked&&r.deadline!==null)r.deadline-=4000});state.timerSeconds=6}storageOK=true;$('storageWarning').hidden=true;save();render();toast('Your activity has been restored.')}catch(error){toast(error.message)}}});
document.addEventListener('click',async e=>{const button=e.target.closest('[data-action]');if(!button)return;const a=button.dataset.action;try{if(a==='home')go('home');else if(a==='open')openGame(Number(button.dataset.game));else if(a==='begin')go({t:'trivia',d:'dilemma',b:'bride'}[button.dataset.kind]);else if(a==='nextTrivia'){if(!state.trivia[state.tIndex].locked)return;if(state.tIndex===4){state.tDone=true;go('tReview')}else{state.tIndex++;go('trivia')}}else if(a==='nextChoice'){const d=button.dataset.kind==='d',arr=d?state.dAnswers:state.bAnswers,index=d?state.dIndex:state.bIndex;if(arr[index]===null)return;if(index===arr.length-1){if(d)state.dDone=true;else state.bDone=true;go(d?'dReview':'bReview')}else{if(d)state.dIndex++;else state.bIndex++;go(d?'dilemma':'bride')}}else if(a==='preview'){if(photoBusy)return;if(!state.wishes.trim()){toast('Add a few words for Pfano first.');$('wishes').focus();return}state.cardViewed=true;go('card')}else if(a==='editCard')go('wishes');else if(a==='removePhoto'){state.photo='';save();render()}else if(a==='downloadPDF'){button.disabled=true;download(await makePDF(),'wishes-for-pfano.pdf');button.disabled=false}else if(a==='downloadCard'||a==='shareCard'){button.disabled=true;const blob=await makeCardBlob(),file=new File([blob],'wishes-for-pfano.png',{type:'image/png'});if(a==='shareCard'&&navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Wishes for Pfano'})}else{download(blob,'wishes-for-pfano.png');if(a==='shareCard')toast('Card downloaded. Attach it in WhatsApp or email.')}button.disabled=false}else if(a==='backup'){download(new Blob([JSON.stringify(state)],{type:'application/json'}),'pfano-high-tea-backup.json');toast('Your backup includes your answers, wishes and photo.')}else if(a==='exportAnswers')exportAnswers(button.dataset.kind);else if(a==='reset')$('resetDialog').showModal()}catch(error){button.disabled=false;if(error.name!=='AbortError')toast(error.message||'That didn’t work. Please try again.')}});
$('cancelReset').onclick=()=>$('resetDialog').close();
$('confirmReset').onclick=()=>{state=fresh();storageOK=true;$('storageWarning').hidden=true;$('resetDialog').close();go('home')};
document.addEventListener('visibilitychange',()=>{if(!document.hidden)updateTimer()});
window.addEventListener('pageshow',updateTimer);
window.addEventListener('pagehide',save);
window.addEventListener('storage',e=>{if(e.key===KEY){storageOK=false;warn('Activity changed in another tab. Reload this page before continuing, or download a backup of this tab.')}});
render();save();
</script>
</body>
</html>
